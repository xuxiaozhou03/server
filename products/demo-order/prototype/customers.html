<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客户管理 · Orderly</title>
  <link rel="stylesheet" href="./shared/panel.css">
</head>
<body data-page="customers">
  <div class="product-app" id="product-app">
    <aside class="product-sidebar" aria-label="产品导航">
      <a class="brand" href="/p/dashboard" aria-label="回到经营概览">
        <span class="brand-mark">O</span>
        <div><strong>Orderly</strong><span>订单运营中心</span></div>
      </a>
      <nav class="nav-list" aria-label="主导航">
          <a class="nav-item" href="/p/dashboard"><span>⌂</span>经营概览</a>
          <a class="nav-item" href="/p/orders"><span>▤</span>订单管理<b id="nav-pending-count">2</b></a>
          <a class="nav-item active" href="/p/customers" aria-current="page"><span>◎</span>客户管理</a>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-tip"><strong>订单中心 · 设计版</strong><span>数据仅用于交互演示</span></div>
        <div class="user-chip"><span class="avatar">王</span><div><strong>王倩</strong><small>运营负责人</small></div><span class="user-more">⋯</span></div>
      </div>
    </aside>

    <div class="product-main">
      <header class="topbar">
        <form class="topbar-search" id="global-search-form" role="search">
          <span aria-hidden="true">⌕</span>
          <input id="global-search" type="search" placeholder="搜索订单、客户或商品…" autocomplete="off" aria-label="全局搜索">
          <kbd>⌘ K</kbd>
        </form>
        <div class="topbar-actions">
          <button class="icon-button" type="button" aria-label="帮助">?</button>
          <button class="icon-button notification-button" type="button" aria-label="通知"><span>♢</span><i></i></button>
          <button class="button-secondary compact" type="button" id="export-button">导出</button>
          <a class="button-primary compact" href="/p/orders?action=create">＋ 新建订单</a>
        </div>
      </header>

      <main class="page-stack" id="page-stack">
        <section class="page-view active" id="page-customers" aria-labelledby="customers-title">
        <div class="page-heading">
          <div><span class="eyebrow">CUSTOMERS / 6</span><h1 id="customers-title">客户管理</h1><p>从客户视角理解订单关系与成交价值。</p></div>
          <div class="heading-actions"><button class="button-secondary" type="button" id="customer-export">导出客户</button><button class="button-primary" type="button" id="customer-create">＋ 新建客户</button></div>
        </div>
        <div class="customer-toolbar">
          <label class="customer-search"><span>⌕</span><input id="customer-search" type="search" placeholder="搜索客户、公司或邮箱"></label>
          <div class="segment-control" id="customer-level-filter"><button class="active" type="button" data-level="all">全部客户</button><button type="button" data-level="vip">VIP</button><button type="button" data-level="enterprise">企业</button><button type="button" data-level="regular">普通</button></div>
        </div>
        <div class="customer-grid" id="customer-grid"></div>
        </section>
      </main>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="./shared/order-app.js"></script>
</body>
</html>
